name: 'Resolves Runs On configuration'
description: 'Resolves Runs On configuration'
inputs:
  github-token:
    description: 'GitHub token'
    required: true
  action:
    description: 'Name of the action (if named)'
    required: false
  main-repository:
    description: 'Full name of the main repository e.g. org/repository'
    required: true
  runs-on:
    description: 'Whether Runs-On is enabled'
    required: false
    default: 'false'
  spot:
    description: 'Whether to use Spot instances'
    required: false
    default: 'false'
  ubuntu-latest:
    description: 'Runs-On runner for ubuntu-latest'
    required: false
    default: 'ubuntu22-full-x64'
  small-instance:
    description: 'AWS small instance'
    required: false
    default: 'm6a.large'
  large-instance:
    description: 'AWS large instance'
    required: false
    default: 'm6a.xlarge'
  volume:
    description: 'Volume configuration for the runner (e.g. 80gb:gp3)'
    required: false
    default: '80gb:gp3'
  magic-cache:
    description: 'Whether Magic Cache is enabled'
    required: false
    default: 'false'
  ami:
    description: 'AMI to use for the runner'
    required: false
outputs:
  config:
    value: ${{ steps.action.outputs.config }}
    description: 'The generated configuration in JSON format'

runs:
  using: "composite"
  steps:
    - name: Set up Java 25
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '25'
        set-default: false
    - name: Inject quarkus-github-action repository credentials
      shell: bash
      run: |
        if [ -f ~/.m2/settings.xml ]; then
          if ! grep -q '<id>quarkus-github-action</id>' ~/.m2/settings.xml; then
            yq -p xml -o xml -i '.settings.servers.server |= (. | [.] + [{"id": "quarkus-github-action", "username": "${env.GITHUB_ACTOR}", "password": "${env.GITHUB_TOKEN}"}])' ~/.m2/settings.xml
          fi
        else
          mkdir -p ~/.m2/
          yq -p xml -o xml -n '.settings.servers.server = {"id": "quarkus-github-action", "username": "${env.GITHUB_ACTOR}", "password": "${env.GITHUB_TOKEN}"}' > ~/.m2/settings.xml
        fi
    - name: Set up JBang
      uses: jbangdev/setup-jbang@main
    - name: Run the action
      id: action
      run: |
        if [[ -n "${JAVA_HOME_25_X64}" ]]; then
          echo "Installing ${JAVA_HOME_25_X64} as JDK 25 for JBang"
          jbang --verbose jdk install java-25 ${JAVA_HOME_25_X64}
        fi
        jbang --java 25 --fresh --repos 'quarkus-github-action=https://maven.pkg.github.com/quarkusio/runs-on-action/' --repos 'mavencentral' io.quarkus.bot:runs-on-action:999-SNAPSHOT
      shell: bash
      env:
        JSON_INPUTS: ${{ toJSON(inputs) }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
